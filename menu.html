<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu | FoodieHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="menu">
<div id="header"></div>
<main>
<section class="section"><h2>Our Menu</h2>

</body>
</html>
