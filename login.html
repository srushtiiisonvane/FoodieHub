<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | FoodieHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<div id="header"></div>
<main>
<section class="section narrow"><h2>Login</h2>
<form id="loginForm" class="card pad" novalidate>
  <div class="field"><label>Email</label><input name="email" type="email"><small class="err"></small></div>
  <div class="field"><label>Password</label><input name="password" type="password"><small class="err"></small></div>
  <button class="btn full" type="submit">Login</button>
  <p class="muted">New to FoodieHub? <a href="signup.html">Create an account</a></p>
</form></section>
</main>
<div id="footer"></div>
<div id="toast" class="toast"></div>
<script src="js/script.js"></script>
</body>
</html>
