<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cart | FoodieHub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="cart">

    <!-- Header -->
    <div id="header"></div>

    <main>

        <section class="section cart-page">

            <!-- Page Heading -->
            <div class="cart-heading">
                <span class="tag">FOODIEHUB</span>
                <h2>Your Cart</h2>
                <p>Review your items and get ready for a delicious meal.</p>
            </div>


            <!-- Cart Layout -->
            <div class="cart-wrap">

                <!-- Cart Items -->
                <div class="cart-left">

                    <div class="cart-box card">

                        <div class="cart-box-header">
                            <h3>Your Items</h3>
                            <span>🛒</span>
                        </div>

                        <div id="cartItems"></div>

                    </div>

                    <!-- Continue Shopping -->
                    <a href="menu.html" class="continue-shopping">
                        ← Continue Shopping
                    </a>

                </div>


                <!-- Summary -->
                <aside class="card pad summary" id="summary">

                    <!-- script.js fills this -->

                </aside>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <div id="footer"></div>

    <div id="toast" class="toast"></div>

    <script src="js/script.js"></script>

</body>

</html>
