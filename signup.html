<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up | FoodieHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">
<div id="header"></div>
<main>
<section class="section narrow"><h2>Create Account</h2>
<form id="signupForm" class="card pad" novalidate>
  <div class="field"><label>Name</label><input name="name"><small class="err"></small></div>
  <div class="field"><label>Email</label><input name="email" type="email"><small class="err"></small></div>
  <div class="field"><label>Password</label><input name="password" type="password"><small class="err"></small></div>
  <div class="field"><label>Confirm Password</label><input name="confirm" type="password"><small class="err"></small></div>
  <button class="btn full" type="submit">Sign Up</button>
  <p class="muted">Already registered? <a href="login.html">Login</a></p>
</form></section>
</main>
<div id="footer"></div>
<div id="toast" class="toast"></div>
<script src="js/script.js"></script>
</body>
</html>
