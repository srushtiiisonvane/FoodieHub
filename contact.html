<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | FoodieHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div id="header"></div>
<main>
<section class="section narrow"><h2>Contact Us</h2>
<form id="contactForm" class="card pad" novalidate>
  <div class="field"><label>Name</label><input name="name"><small class="err"></small></div>
  <div class="field"><label>Email</label><input name="email" type="email"><small class="err"></small></div>
  <div class="field"><label>Subject</label><input name="subject"><small class="err"></small></div>
  <div class="field"><label>Message</label><textarea name="message" rows="4"></textarea><small class="err"></small></div>
  <button class="btn full" type="submit">Send Message</button>
  <p class="muted">📍 Mumbai, India &nbsp; 📞 +91 98765 43210 &nbsp; ✉ support@foodiehub.com</p>
</form></section>
</main>
<div id="footer"></div>
<div id="toast" class="toast"></div>
<script src="js/script.js"></script>
</body>
</html>
